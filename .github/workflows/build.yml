name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    env:
      VS_VERSION: 1.22.7
      VS_SERVER_SHA256: a7d4a520604590a96de812ee6c6baf4404d43d86cf1ec4fbac1b3a580b52c847
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/validate_release.py --tag "$RELEASE_TAG"

      - name: Download game references
        shell: bash
        run: |
          archive="$RUNNER_TEMP/vintagestory-server.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$VS_SERVER_SHA256" "$archive" | sha256sum --check --strict
          game_directory="$RUNNER_TEMP/vintagestory"
          mkdir -p "$game_directory"
          tar -xzf "$archive" -C "$game_directory"
          echo "VINTAGE_STORY=$game_directory" >> "$GITHUB_ENV"

      - name: Test and package
        run: bash scripts/build.sh

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: resingrove-${{ steps.metadata.outputs.version }}
          path: artifacts/resingrove-${{ steps.metadata.outputs.version }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: resingrove-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          MOD_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" "artifacts/resingrove-${MOD_VERSION}.zip" \
              --verify-tag --draft --title "Resin Grove ${RELEASE_TAG#v}" --generate-notes
          fi
